[package]
name = "heliopause"
version = "0.1.0"
description = "A local LLM desktop workspace powered by Tauri and WebGPU."
authors = ["Heliopause contributors"]
edition = "2021"

[lib]
name = "heliopause_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
